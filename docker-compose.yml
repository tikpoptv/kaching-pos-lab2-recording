services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kaching
      POSTGRES_USER: kaching
      POSTGRES_PASSWORD: kaching_local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaching -d kaching"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - kaching_postgres_data:/var/lib/postgresql/data

volumes:
  kaching_postgres_data:
