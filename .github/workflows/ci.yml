name: CI

on:
  push:
    branches: [main, lab2-staging]
  pull_request:
    branches: [main, lab2-staging]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm test
      - run: npm run build
